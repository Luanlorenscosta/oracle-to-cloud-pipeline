services:

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-source
    environment:
      ORACLE_PASSWORD: Oracle123
      ORACLE_DATABASE: XEPDB1
      APP_USER: financeiro
      APP_USER_PASSWORD: Financeiro123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:15
    container_name: postgres-target
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: financeiro_cloud
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oracle-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: oracle-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - oracle-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: oracle-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - oracle-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oracle-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: oracle-pipeline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - oracle-net

volumes:
  oracle_data:
  postgres_data:

networks:
  oracle-net:
    driver: bridge
